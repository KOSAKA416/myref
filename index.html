<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CreativeRef — リファレンス管理</title>
<style>
/* =====================================================
   CreativeRef — style.css
   ダークテーマ × クリエイター管理ツール風デザイン
   Notion + PureRef + Pinterest を参考にしたUI
   ===================================================== */

/* ---------- CSS変数（色・サイズ） ---------- */
:root {
  /* ベースカラー */
  --bg-base:       #0d0d0f;   /* 最も暗い背景 */
  --bg-surface:    #141417;   /* カード・モーダル背景 */
  --bg-raised:     #1c1c21;   /* サイドバー・ホバー */
  --bg-hover:      #25252c;   /* ホバー時 */
  --bg-input:      #1a1a1f;   /* インプット背景 */

  /* ボーダー */
  --border:        #2a2a35;
  --border-focus:  #5b5fc7;   /* フォーカス時：インディゴ */

  /* テキスト */
  --text-primary:  #e8e8f0;
  --text-secondary:#9090a8;
  --text-muted:    #55556a;

  /* アクセントカラー：電気系インディゴ */
  --accent:        #6366f1;
  --accent-hover:  #4f52d4;
  --accent-soft:   rgba(99,102,241,0.15);

  /* タグカラーパレット（8色ローテーション） */
  --tag-0: #3b4ab0;
  --tag-1: #2d6a4f;
  --tag-2: #6d2b7b;
  --tag-3: #8a3a2a;
  --tag-4: #1a5e7a;
  --tag-5: #4a4222;
  --tag-6: #1e4d3a;
  --tag-7: #2a3e6a;

  /* ステータスカラー */
  --fav-color:   #f4c542;
  --danger:      #d94545;
  --success:     #3ecf6e;

  /* レイアウト */
  --sidebar-width: 240px;
  --topbar-height: 60px;
  --radius:        8px;
  --radius-lg:     12px;
  --radius-full:   999px;

  /* フォント */
  --font-main: 'Segoe UI', 'Hiragino Kaku Gothic ProN', Meiryo, system-ui, sans-serif;
  --font-mono: 'Fira Code', 'Consolas', monospace;
}

/* ---------- リセット・ベース ---------- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  background: var(--bg-base);
  color: var(--text-primary);
  font-family: var(--font-main);
  font-size: 14px;
  line-height: 1.6;
  display: flex;
  min-height: 100vh;
  overflow-x: hidden;
}

a { color: var(--accent); text-decoration: none; }
button { cursor: pointer; border: none; background: none; font-family: inherit; }
input, select, textarea { font-family: inherit; }
ul { list-style: none; }
img { display: block; max-width: 100%; }

/* ---------- スクロールバー ---------- */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: var(--radius-full); }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* =====================================================
   サイドバー
   ===================================================== */
.sidebar {
  width: var(--sidebar-width);
  min-height: 100vh;
  background: var(--bg-raised);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: fixed;
  left: 0; top: 0;
  z-index: 100;
  overflow-y: auto;
  overflow-x: hidden;
  transition: transform 0.25s ease;
}

.sidebar-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 18px 16px 14px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--bg-raised);
  z-index: 1;
}

.logo-icon {
  font-size: 22px;
  color: var(--accent);
  line-height: 1;
}

.logo-text {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: var(--text-primary);
}

/* サイドバー内検索 */
.sidebar-search-wrap {
  padding: 12px 12px 4px;
}

.sidebar-search {
  width: 100%;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 7px 10px;
  color: var(--text-primary);
  font-size: 12px;
  outline: none;
  transition: border-color 0.2s;
}

.sidebar-search:focus {
  border-color: var(--border-focus);
}

/* セクションラベル */
.sidebar-section-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 12px 6px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--text-muted);
}

/* クイックフィルター */
.quick-filters { padding: 0 8px 8px; }

.filter-btn {
  width: 100%;
  text-align: left;
  padding: 7px 10px;
  border-radius: var(--radius);
  color: var(--text-secondary);
  font-size: 13px;
  transition: background 0.15s, color 0.15s;
}

.filter-btn:hover,
.filter-btn.active {
  background: var(--accent-soft);
  color: var(--accent);
}

/* カテゴリーツリー */
.category-tree {
  padding: 0 6px 8px;
  flex: 1;
}

/* ツリーノード共通 */
.cat-node {}

.cat-row {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 5px 6px;
  border-radius: var(--radius);
  cursor: pointer;
  transition: background 0.15s;
  position: relative;
  min-height: 30px;
}

.cat-row:hover { background: var(--bg-hover); }
.cat-row.selected { background: var(--accent-soft); }
.cat-row.selected .cat-name { color: var(--accent); }

/* 折りたたみ矢印 */
.cat-toggle {
  width: 16px;
  height: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  font-size: 10px;
  flex-shrink: 0;
  transition: transform 0.15s;
  border-radius: 3px;
}

.cat-toggle:hover { background: var(--bg-hover); color: var(--text-secondary); }
.cat-toggle.open { transform: rotate(90deg); }
.cat-toggle.leaf { cursor: default; opacity: 0; }

.cat-name {
  flex: 1;
  font-size: 13px;
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  user-select: none;
}

/* ホバー時のアクションボタン */
.cat-actions {
  display: none;
  gap: 2px;
  flex-shrink: 0;
}

.cat-row:hover .cat-actions { display: flex; }

.cat-action-btn {
  width: 18px;
  height: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 3px;
  font-size: 10px;
  color: var(--text-muted);
  transition: background 0.1s, color 0.1s;
}

.cat-action-btn:hover { background: var(--bg-hover); color: var(--text-secondary); }
.cat-action-btn.danger:hover { color: var(--danger); }

/* 子ノードのインデント */
.cat-children {
  padding-left: 14px;
}

/* バックアップボタン */
.backup-btns {
  padding: 4px 10px 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

/* =====================================================
   メインコンテンツ
   ===================================================== */
.main {
  margin-left: var(--sidebar-width);
  flex: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ---------- トップバー ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  height: var(--topbar-height);
  background: rgba(13,13,15,0.85);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  gap: 12px;
}

.topbar-left {
  display: flex;
  align-items: baseline;
  gap: 10px;
}

.page-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 240px;
}

.card-count {
  font-size: 12px;
  color: var(--text-muted);
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

/* ---------- ボタン共通 ---------- */
.btn-primary {
  background: var(--accent);
  color: #fff;
  padding: 7px 16px;
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 600;
  transition: background 0.15s, transform 0.1s;
  white-space: nowrap;
}

.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:active { transform: scale(0.97); }

.btn-outline {
  background: transparent;
  color: var(--text-secondary);
  border: 1px solid var(--border);
  padding: 7px 14px;
  border-radius: var(--radius);
  font-size: 13px;
  transition: border-color 0.15s, color 0.15s, background 0.15s;
  white-space: nowrap;
}

.btn-outline:hover {
  border-color: var(--text-muted);
  color: var(--text-primary);
  background: var(--bg-hover);
}

.btn-danger {
  background: transparent;
  color: var(--danger);
  border: 1px solid var(--danger);
  padding: 7px 14px;
  border-radius: var(--radius);
  font-size: 13px;
  transition: background 0.15s;
  white-space: nowrap;
}

.btn-danger:hover { background: rgba(217,69,69,0.1); }

.btn-sm { padding: 5px 10px; font-size: 12px; }

.icon-btn {
  width: 20px;
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 4px;
  color: var(--text-muted);
  font-size: 14px;
  transition: color 0.15s, background 0.15s;
}
.icon-btn:hover { color: var(--accent); background: var(--accent-soft); }

/* ---------- 並び替えセレクト ---------- */
.sort-select {
  background: var(--bg-input);
  color: var(--text-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 6px 10px;
  font-size: 13px;
  outline: none;
  cursor: pointer;
  transition: border-color 0.15s;
}

.sort-select:focus { border-color: var(--border-focus); }

/* =====================================================
   カードグリッド（Pinterest風マソンリー）
   ===================================================== */
.card-grid {
  padding: 24px;
  columns: 4 220px;      /* 最大4列、最小幅220px */
  column-gap: 16px;
}

/* ---------- カード ---------- */
.ref-card {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  margin-bottom: 16px;
  break-inside: avoid;
  cursor: pointer;
  transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s;
  position: relative;
}

.ref-card:hover {
  border-color: var(--accent);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}

/* サムネイル */
.card-thumb {
  width: 100%;
  aspect-ratio: 16/9;
  object-fit: cover;
  display: block;
  background: var(--bg-raised);
}

/* 仮サムネイル（URL種別表示） */
.card-thumb-placeholder {
  width: 100%;
  aspect-ratio: 16/9;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: var(--bg-raised);
  border-bottom: 1px solid var(--border);
  gap: 6px;
}

.card-thumb-placeholder .placeholder-icon {
  font-size: 28px;
  line-height: 1;
}

.card-thumb-placeholder .placeholder-label {
  font-size: 10px;
  color: var(--text-muted);
  letter-spacing: 0.5px;
}

/* カード本文 */
.card-body {
  padding: 12px 14px;
}

.card-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  line-height: 1.4;
  margin-bottom: 6px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-cat {
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 4px;
  flex-wrap: wrap;
}

.card-cat-sep { color: var(--border); }

.card-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-bottom: 8px;
}

/* お気に入りバッジ */
.card-fav-badge {
  position: absolute;
  top: 8px;
  right: 8px;
  background: rgba(0,0,0,0.6);
  border-radius: var(--radius-full);
  width: 26px;
  height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
}

/* ---------- タグ ---------- */
.tag {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: var(--radius-full);
  font-size: 11px;
  font-weight: 500;
  color: #d0d0e8;
  background: var(--tag-0);
  white-space: nowrap;
}

/* タグ色ローテーション */
.tag:nth-child(8n+1) { background: var(--tag-0); }
.tag:nth-child(8n+2) { background: var(--tag-1); }
.tag:nth-child(8n+3) { background: var(--tag-2); }
.tag:nth-child(8n+4) { background: var(--tag-3); }
.tag:nth-child(8n+5) { background: var(--tag-4); }
.tag:nth-child(8n+6) { background: var(--tag-5); }
.tag:nth-child(8n+7) { background: var(--tag-6); }
.tag:nth-child(8n+0) { background: var(--tag-7); }

/* ---------- 空状態 ---------- */
.empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 80px 24px;
  text-align: center;
}

.empty-icon { font-size: 48px; }

.empty-state p {
  font-size: 15px;
  color: var(--text-secondary);
}

.empty-sub { font-size: 13px; color: var(--text-muted); }

/* =====================================================
   モーダル共通
   ===================================================== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  backdrop-filter: blur(4px);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  width: 100%;
  max-width: 540px;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: modalIn 0.2s ease;
}

.modal-detail { max-width: 600px; }
.modal-sm     { max-width: 380px; }

@keyframes modalIn {
  from { opacity: 0; transform: translateY(16px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 20px 14px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.modal-header h2 {
  font-size: 16px;
  font-weight: 600;
  color: var(--text-primary);
}

.modal-close {
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius);
  color: var(--text-muted);
  font-size: 14px;
  transition: background 0.15s, color 0.15s;
}

.modal-close:hover { background: var(--bg-hover); color: var(--text-primary); }

.modal-body {
  flex: 1;
  overflow-y: auto;
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  padding: 14px 20px;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

/* ---------- フォーム部品 ---------- */
.form-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  letter-spacing: 0.5px;
  margin-bottom: -6px;
}

.required { color: var(--danger); margin-left: 2px; }

.form-input {
  width: 100%;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 8px 12px;
  color: var(--text-primary);
  font-size: 13px;
  outline: none;
  transition: border-color 0.2s;
}

.form-input:focus { border-color: var(--border-focus); }

select.form-input { cursor: pointer; }
select.form-input option { background: var(--bg-raised); }

.form-textarea {
  width: 100%;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 8px 12px;
  color: var(--text-primary);
  font-size: 13px;
  resize: vertical;
  min-height: 80px;
  outline: none;
  line-height: 1.6;
  transition: border-color 0.2s;
}

.form-textarea:focus { border-color: var(--border-focus); }

.form-check {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--text-secondary);
  cursor: pointer;
}

.form-check input[type="checkbox"] {
  width: 15px;
  height: 15px;
  accent-color: var(--accent);
  cursor: pointer;
}

/* ---------- サムネイルエリア ---------- */
.thumb-area {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.thumb-preview {
  width: 100%;
  aspect-ratio: 16/9;
  background: var(--bg-raised);
  border: 1px dashed var(--border);
  border-radius: var(--radius);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
  transition: border-color 0.2s;
}

.thumb-preview.drag-over {
  border-color: var(--accent);
  background: var(--accent-soft);
}

.thumb-preview img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#thumbPlaceholder {
  font-size: 12px;
  color: var(--text-muted);
  text-align: center;
  padding: 12px;
  pointer-events: none;
}

/* ---------- タグ入力 ---------- */
.tag-input-wrap {
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 8px 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  cursor: text;
  min-height: 40px;
  transition: border-color 0.2s;
}

.tag-input-wrap:focus-within { border-color: var(--border-focus); }

.tag-input {
  background: none;
  border: none;
  outline: none;
  color: var(--text-primary);
  font-size: 13px;
  min-width: 120px;
  flex: 1;
}

.tag-deletable {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: var(--radius-full);
  font-size: 11px;
  font-weight: 500;
  color: #d0d0e8;
}

.tag-deletable button {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
  color: #fff;
  font-size: 9px;
  transition: background 0.1s;
}

.tag-deletable button:hover { background: rgba(255,255,255,0.3); }

/* ---------- 詳細モーダル ---------- */
.detail-thumb {
  width: 100%;
  max-height: 280px;
  object-fit: cover;
  border-radius: var(--radius);
  border: 1px solid var(--border);
}

.detail-thumb-placeholder {
  width: 100%;
  height: 120px;
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 36px;
}

.detail-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  font-size: 12px;
  color: var(--text-muted);
  align-items: center;
}

.detail-cat {
  color: var(--accent);
  font-weight: 600;
}

.detail-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.detail-section-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 6px;
}

.detail-memo p {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.7;
  white-space: pre-wrap;
}

.detail-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding-top: 4px;
}

/* =====================================================
   トースト通知
   ===================================================== */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 18px;
  font-size: 13px;
  color: var(--text-primary);
  z-index: 999;
  transform: translateY(80px);
  opacity: 0;
  transition: transform 0.25s ease, opacity 0.25s ease;
  pointer-events: none;
  max-width: 300px;
}

.toast.show {
  transform: translateY(0);
  opacity: 1;
}

.toast.success { border-color: var(--success); }
.toast.error   { border-color: var(--danger); }

/* =====================================================
   ハンバーガーメニュー（モバイル）
   ===================================================== */
.hamburger {
  display: none;
  position: fixed;
  top: 14px;
  left: 14px;
  z-index: 300;
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  width: 36px;
  height: 36px;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 6px;
}

.hamburger span {
  display: block;
  width: 18px;
  height: 2px;
  background: var(--text-secondary);
  border-radius: 1px;
  transition: transform 0.2s, opacity 0.2s;
}

.sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 99;
}

/* =====================================================
   レスポンシブ
   ===================================================== */
@media (max-width: 960px) {
  .card-grid { columns: 3 180px; }
}

@media (max-width: 700px) {
  /* ハンバーガー表示 */
  .hamburger { display: flex; }

  /* サイドバーをスライドイン式に */

    transform: translateX(-100%);
  }

  .sidebar.open {
    transform: translateX(0);
    box-shadow: 4px 0 24px rgba(0,0,0,0.5);
  }

  .sidebar-overlay.open { display: block; }

  /* メインを全幅に */
  .main { margin-left: 0; }

  .topbar { padding: 0 14px 0 56px; }

  .page-title { max-width: 120px; font-size: 14px; }

  .card-grid { padding: 14px; columns: 2 140px; column-gap: 10px; }

  .detail-actions { gap: 6px; }
  .detail-actions .btn-primary,
  .detail-actions .btn-outline,
  .detail-actions .btn-danger { padding: 6px 10px; font-size: 12px; }
}

@media (max-width: 420px) {
  .card-grid { columns: 1; }
  .topbar-right .sort-select { display: none; }
}
</style>
</head>
<body>

  <!-- ========== モバイル用ハンバーガー ========== -->

    <span></span><span></span><span></span>

  <!-- ========== サイドバーオーバーレイ（モバイル） ========== -->

  <!-- ========== メインコンテンツ ========== -->
  <main class="main" id="main">
    <header class="topbar">

  <!-- ========== カテゴリー管理モーダル ========== -->

  <!-- ========== トースト通知 ========== -->

<script>
/* =====================================================
   CreativeRef — script.js
   全機能をここで管理。LocalStorageでデータを永続化。
   ===================================================== */

/* =====================================================
   ① 初期データ定義
   ===================================================== */

// デフォルトカテゴリーツリー（階層構造）
const DEFAULT_CATEGORIES = [
  {
    id: 'cat_video', name: '動画', children: [
      {
        id: 'cat_mv', name: 'MV', children: [
          { id: 'cat_mv_lyric',  name: '歌詞演出',  children: [] },
          { id: 'cat_mv_sabi',   name: 'サビ演出',  children: [] },
          { id: 'cat_mv_glitch', name: 'グリッチ',  children: [] },
          { id: 'cat_mv_cam',    name: 'カメラワーク', children: [] },
          { id: 'cat_mv_trans',  name: 'トランジション', children: [] },
          { id: 'cat_mv_color',  name: '色味',      children: [] },
          { id: 'cat_mv_ref',    name: '参考構成',  children: [] },
        ]
      },
      { id: 'cat_telop', name: 'テロップ', children: [] },
      { id: 'cat_motion', name: 'モーショングラフィックス', children: [] },
      { id: 'cat_blender', name: 'Blender', children: [] },
      { id: 'cat_ae', name: 'After Effects', children: [] },
    ]
  },
  {
    id: 'cat_illust', name: 'イラスト', children: [
      { id: 'cat_il_comp',  name: '構図',       children: [] },
      { id: 'cat_il_face',  name: '表情',       children: [] },
      { id: 'cat_il_pose',  name: 'ポーズ',     children: [] },
      { id: 'cat_il_bg',    name: '背景',       children: [] },
      { id: 'cat_il_paint', name: '塗り',       children: [] },
      { id: 'cat_il_char',  name: 'キャラデザイン', children: [] },
    ]
  },
  {
    id: 'cat_x', name: 'X', children: [
      { id: 'cat_x_sales',  name: '営業ポスト',   children: [] },
      { id: 'cat_x_result', name: '実績投稿',     children: [] },
      { id: 'cat_x_price',  name: '料金表',       children: [] },
      { id: 'cat_x_creator',name: '参考クリエイター', children: [] },
      { id: 'cat_x_text',   name: '文章表現',     children: [] },
    ]
  },
  {
    id: 'cat_design', name: 'デザイン', children: [
      { id: 'cat_d_font',   name: 'フォント',   children: [] },
      { id: 'cat_d_color',  name: '配色',       children: [] },
      { id: 'cat_d_logo',   name: 'ロゴ',       children: [] },
      { id: 'cat_d_layout', name: 'レイアウト', children: [] },
    ]
  },
  { id: 'cat_other', name: 'その他', children: [] },
];

/* =====================================================
   ② LocalStorage ユーティリティ
   ===================================================== */

const STORAGE_KEYS = {
  refs:       'creativeref_refs',       // リファレンス一覧
  categories: 'creativeref_categories', // カテゴリーツリー
  recent:     'creativeref_recent',     // 最近見たID一覧（最大20件）
};

function loadData(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch {
    return fallback;
  }
}

function saveData(key, data) {
  localStorage.setItem(key, JSON.stringify(data));
}

/* =====================================================
   ③ アプリ状態
   ===================================================== */

let refs       = loadData(STORAGE_KEYS.refs, []);       // リファレンス配列
let categories = loadData(STORAGE_KEYS.categories, DEFAULT_CATEGORIES); // カテゴリーツリー
let recentIds  = loadData(STORAGE_KEYS.recent, []);     // 最近見たID

// UIの状態
let currentFilter    = 'all';     // 'all' | 'fav' | 'recent'
let selectedCatId    = null;      // 選択中カテゴリーID
let currentSort      = 'newest';  // 並び順
let searchQuery      = '';        // 検索ワード
let editingRefId     = null;      // 編集中のリファレンスID（新規ならnull）
let editingCatInfo   = null;      // カテゴリー編集情報 {parentId, catId, mode:'add'|'edit'}
let confirmCallback  = null;      // 削除確認後のコールバック
let formTags         = [];        // フォーム内のタグ一時保持
let currentDetailId  = null;      // 詳細モーダルで開いているID

/* =====================================================
   ④ カテゴリーユーティリティ
   ===================================================== */

// IDからカテゴリーノードを検索（再帰）
function findCatById(nodes, id) {
  for (const n of nodes) {
    if (n.id === id) return n;
    const found = findCatById(n.children, id);
    if (found) return found;
  }
  return null;
}

// IDのパス（名前の配列）を取得
function getCatPath(nodes, id, path = []) {
  for (const n of nodes) {
    if (n.id === id) return [...path, n.name];
    const found = getCatPath(n.children, id, [...path, n.name]);
    if (found) return found;
  }
  return null;
}

// IDのパス文字列（例：「動画 > MV > グリッチ」）
function getCatPathStr(id) {
  if (!id) return '';
  const path = getCatPath(categories, id);
  return path ? path.join(' > ') : '';
}

// 親ノードの配列を返す（子削除に使う）
function findParentChildren(nodes, targetId, parent = null) {
  for (const n of nodes) {
    if (n.id === targetId) return parent ? parent.children : nodes;
    const found = findParentChildren(n.children, targetId, n);
    if (found) return found;
  }
  return null;
}

// ユニークIDを生成
function genId(prefix = 'id') {
  return `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
}

/* =====================================================
   ⑤ URL種別の判定（仮サムネイル用）
   ===================================================== */

function detectUrlType(url) {
  if (!url) return { icon: '🔗', label: 'リンク' };
  const u = url.toLowerCase();
  if (u.includes('youtube.com') || u.includes('youtu.be')) return { icon: '▶️', label: 'YouTube' };
  if (u.includes('twitter.com') || u.includes('x.com'))   return { icon: '𝕏', label: 'X / Twitter' };
  if (u.includes('nicovideo.jp') || u.includes('nico.ms')) return { icon: '🎬', label: 'ニコニコ' };
  if (u.includes('pixiv.net'))   return { icon: '🎨', label: 'pixiv' };
  if (u.includes('instagram.com')) return { icon: '📷', label: 'Instagram' };
  if (u.includes('tiktok.com'))  return { icon: '🎵', label: 'TikTok' };
  if (u.includes('pinterest.com')) return { icon: '📌', label: 'Pinterest' };
  if (u.includes('behance.net')) return { icon: '🖼️', label: 'Behance' };
  if (u.includes('github.com'))  return { icon: '🐙', label: 'GitHub' };
  if (u.includes('notion.so'))   return { icon: '📝', label: 'Notion' };
  if (u.includes('vimeo.com'))   return { icon: '🎞️', label: 'Vimeo' };
  return { icon: '🔗', label: '外部リンク' };
}

/* =====================================================
   ⑥ カードのレンダリング
   ===================================================== */

function renderCards() {
  const grid  = document.getElementById('cardGrid');
  const empty = document.getElementById('emptyState');
  const count = document.getElementById('cardCount');

  // フィルタリング
  let filtered = refs.filter(r => {
    // クイックフィルター
    if (currentFilter === 'fav') return r.favorite;
    if (currentFilter === 'recent') return recentIds.includes(r.id);
    return true;
  });

  // カテゴリー絞り込み
  if (selectedCatId) {
    // 選択カテゴリー自身 or その子孫IDを含むものを表示
    const matchIds = getAllDescendantIds(categories, selectedCatId);
    matchIds.push(selectedCatId);
    filtered = filtered.filter(r =>
      matchIds.includes(r.catGrand) ||
      matchIds.includes(r.catChild) ||
      matchIds.includes(r.catParent)
    );
  }

  // 検索
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    filtered = filtered.filter(r =>
      r.title.toLowerCase().includes(q) ||
      (r.memo  && r.memo.toLowerCase().includes(q)) ||
      (r.tags  && r.tags.some(t => t.toLowerCase().includes(q)))
    );
  }

  // 並び替え
  filtered = [...filtered].sort((a, b) => {
    if (currentSort === 'newest') return b.createdAt - a.createdAt;
    if (currentSort === 'oldest') return a.createdAt - b.createdAt;
    if (currentSort === 'fav')    return (b.favorite ? 1 : 0) - (a.favorite ? 1 : 0);
    if (currentSort === 'views')  return b.views - a.views;
    return 0;
  });

  count.textContent = `${filtered.length} 件`;

  if (filtered.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'flex';
    return;
  }

  empty.style.display = 'none';
  grid.innerHTML = filtered.map(r => cardHTML(r)).join('');

  // カードクリックで詳細を開く
  grid.querySelectorAll('.ref-card').forEach(el => {
    el.addEventListener('click', () => openDetail(el.dataset.id));
  });
}

// 子孫カテゴリーID一覧（再帰）
function getAllDescendantIds(nodes, targetId) {
  const target = findCatById(nodes, targetId);
  if (!target) return [];
  const ids = [];
  function collect(node) {
    node.children.forEach(c => { ids.push(c.id); collect(c); });
  }
  collect(target);
  return ids;
}

// カード1枚分のHTML
function cardHTML(r) {
  const catPath = getCatPathStr(r.catGrand || r.catChild || r.catParent);
  const tagsHtml = (r.tags || []).slice(0, 4)
    .map(t => `<span class="tag">${escHtml(t)}</span>`).join('');
  const favBadge = r.favorite ? '<div class="card-fav-badge">⭐</div>' : '';

  let thumbHtml;
  if (r.thumbnail) {
    thumbHtml = `<img class="card-thumb" src="${escHtml(r.thumbnail)}" alt="" loading="lazy"
      onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />
      ${placeholderHTML(r.url, true)}`;
  } else {
    thumbHtml = placeholderHTML(r.url, false);
  }

  return `
    <div class="ref-card" data-id="${r.id}">
      ${favBadge}
      ${thumbHtml}
      <div class="card-body">
        <div class="card-title">${escHtml(r.title)}</div>
        ${catPath ? `<div class="card-cat">${escHtml(catPath)}</div>` : ''}
        ${tagsHtml ? `<div class="card-tags">${tagsHtml}</div>` : ''}
      </div>
    </div>`;
}

// 仮サムネイルHTML
function placeholderHTML(url, hidden) {
  const { icon, label } = detectUrlType(url);
  const style = hidden ? 'display:none' : '';
  return `<div class="card-thumb-placeholder" style="${style}">
    <span class="placeholder-icon">${icon}</span>
    <span class="placeholder-label">${escHtml(label)}</span>
  </div>`;
}

/* =====================================================
   ⑦ カテゴリーツリーのレンダリング
   ===================================================== */

function renderCategoryTree() {
  const tree = document.getElementById('categoryTree');
  tree.innerHTML = '';
  renderNodes(categories, tree, 0);
}

function renderNodes(nodes, container, depth) {
  nodes.forEach(node => {
    const li = document.createElement('li');
    li.className = 'cat-node';

    const hasChildren = node.children.length > 0;

    // ローカルストレージで折りたたみ状態を管理
    const openKey = `cat_open_${node.id}`;
    let isOpen = loadData(openKey, depth === 0); // ルートはデフォルトで開く

    const row = document.createElement('div');
    row.className = 'cat-row' + (selectedCatId === node.id ? ' selected' : '');
    row.dataset.id = node.id;

    // 折りたたみ矢印
    const toggle = document.createElement('span');
    toggle.className = `cat-toggle${!hasChildren ? ' leaf' : ''}${isOpen ? ' open' : ''}`;
    toggle.textContent = '▶';

    // カテゴリー名
    const nameSpan = document.createElement('span');
    nameSpan.className = 'cat-name';
    nameSpan.textContent = node.name;

    // アクションボタン群
    const actions = document.createElement('div');
    actions.className = 'cat-actions';
    actions.innerHTML = `
      <button class="cat-action-btn" title="子カテゴリーを追加" data-action="addChild">＋</button>
      <button class="cat-action-btn" title="名前を変更" data-action="edit">✏</button>
      <button class="cat-action-btn danger" title="削除" data-action="delete">✕</button>
    `;

    row.append(toggle, nameSpan, actions);

    // 子リスト
    const childUl = document.createElement('ul');
    childUl.className = 'cat-children';
    childUl.style.display = isOpen ? '' : 'none';
    if (hasChildren) renderNodes(node.children, childUl, depth + 1);

    // クリックでカテゴリー選択
    row.addEventListener('click', (e) => {
      if (e.target.closest('.cat-actions')) return;
      if (e.target === toggle && hasChildren) return; // toggle専用ハンドラに任せる
      // カテゴリー選択
      selectedCatId = selectedCatId === node.id ? null : node.id;
      currentFilter = 'all';
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      document.querySelector('[data-filter="all"]').classList.add('active');
      updatePageTitle();
      renderCards();
      renderCategoryTree();
    });

    // 折りたたみトグル
    toggle.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!hasChildren) return;
      isOpen = !isOpen;
      saveData(openKey, isOpen);
      toggle.classList.toggle('open', isOpen);
      childUl.style.display = isOpen ? '' : 'none';
    });

    // アクションボタンの処理
    actions.addEventListener('click', (e) => {
      e.stopPropagation();
      const action = e.target.closest('[data-action]')?.dataset.action;
      if (!action) return;

      if (action === 'addChild') {
        editingCatInfo = { parentId: node.id, catId: null, mode: 'add' };
        document.getElementById('catModalTitle').textContent = `「${node.name}」に追加`;
        document.getElementById('catNameInput').value = '';
        openModal('catModal');
      }
      if (action === 'edit') {
        editingCatInfo = { parentId: null, catId: node.id, mode: 'edit' };
        document.getElementById('catModalTitle').textContent = 'カテゴリー名を変更';
        document.getElementById('catNameInput').value = node.name;
        openModal('catModal');
      }
      if (action === 'delete') {
        showConfirm(
          `「${node.name}」を削除します。このカテゴリーに紐づくリファレンスのカテゴリー情報は消去されます。`,
          () => {
            deleteCategoryNode(node.id);
            saveData(STORAGE_KEYS.categories, categories);
            if (selectedCatId === node.id) selectedCatId = null;
            renderCategoryTree();
            renderCards();
            showToast('カテゴリーを削除しました', 'success');
          }
        );
      }
    });

    li.append(row, childUl);
    container.appendChild(li);
  });
}

// カテゴリーを再帰削除
function deleteCategoryNode(id) {
  const arr = findParentChildren(categories, id) || categories;
  const idx = arr.findIndex(n => n.id === id);
  if (idx !== -1) {
    // 紐づくリファレンスのカテゴリー情報をクリア
    refs.forEach(r => {
      if (r.catParent === id || r.catChild === id || r.catGrand === id) {
        r.catParent = ''; r.catChild = ''; r.catGrand = '';
      }
    });
    saveData(STORAGE_KEYS.refs, refs);
    arr.splice(idx, 1);
  }
}

/* =====================================================
   ⑧ フォームのカテゴリーセレクト更新
   ===================================================== */

function buildCatOptions(nodes, select, emptyLabel = '— 選択 —') {
  select.innerHTML = `<option value="">${emptyLabel}</option>`;
  nodes.forEach(n => {
    const opt = document.createElement('option');
    opt.value = n.id;
    opt.textContent = n.name;
    select.appendChild(opt);
  });
}

// 大カテゴリー選択 → 小カテゴリー更新
function updateChildSelect() {
  const parentId = document.getElementById('fCatParent').value;
  const childSel = document.getElementById('fCatChild');
  const grandSel = document.getElementById('fCatGrand');
  const parentNode = parentId ? findCatById(categories, parentId) : null;
  buildCatOptions(parentNode ? parentNode.children : [], childSel);
  buildCatOptions([], grandSel);
}

// 小カテゴリー選択 → 孫カテゴリー更新
function updateGrandSelect() {
  const childId = document.getElementById('fCatChild').value;
  const grandSel = document.getElementById('fCatGrand');
  const childNode = childId ? findCatById(categories, childId) : null;
  buildCatOptions(childNode ? childNode.children : [], grandSel);
}

/* =====================================================
   ⑨ 新規登録 / 編集フォーム
   ===================================================== */

function openNewForm() {
  editingRefId = null;
  formTags     = [];
  document.getElementById('formTitle').textContent = '新規登録';
  document.getElementById('fTitle').value   = '';
  document.getElementById('fUrl').value     = '';
  document.getElementById('fThumbUrl').value = '';
  document.getElementById('fMemo').value    = '';
  document.getElementById('fFav').checked   = false;
  document.getElementById('thumbImg').style.display = 'none';
  document.getElementById('thumbPlaceholder').style.display = '';
  document.getElementById('thumbImg').src = '';
  buildCatOptions(categories, document.getElementById('fCatParent'));
  updateChildSelect();
  renderFormTags();
  openModal('formModal');
  setTimeout(() => document.getElementById('fTitle').focus(), 100);
}

function openEditForm(id) {
  const r = refs.find(x => x.id === id);
  if (!r) return;
  editingRefId = id;
  formTags = [...(r.tags || [])];

  document.getElementById('formTitle').textContent = '編集';
  document.getElementById('fTitle').value   = r.title;
  document.getElementById('fUrl').value     = r.url || '';
  document.getElementById('fThumbUrl').value = r.thumbnail || '';
  document.getElementById('fMemo').value    = r.memo || '';
  document.getElementById('fFav').checked   = r.favorite || false;

  // サムネイルプレビュー
  if (r.thumbnail) {
    document.getElementById('thumbImg').src = r.thumbnail;
    document.getElementById('thumbImg').style.display = 'block';
    document.getElementById('thumbPlaceholder').style.display = 'none';
  } else {
    document.getElementById('thumbImg').style.display = 'none';
    document.getElementById('thumbPlaceholder').style.display = '';
  }

  // カテゴリーを復元
  buildCatOptions(categories, document.getElementById('fCatParent'));
  document.getElementById('fCatParent').value = r.catParent || '';
  updateChildSelect();
  document.getElementById('fCatChild').value  = r.catChild || '';
  updateGrandSelect();
  document.getElementById('fCatGrand').value  = r.catGrand || '';

  renderFormTags();
  openModal('formModal');
}

function saveForm() {
  const title = document.getElementById('fTitle').value.trim();
  if (!title) {
    showToast('タイトルを入力してください', 'error');
    document.getElementById('fTitle').focus();
    return;
  }

  const now = Date.now();
  const r = {
    id:         editingRefId || genId('ref'),
    title,
    url:        document.getElementById('fUrl').value.trim(),
    thumbnail:  document.getElementById('fThumbUrl').value.trim(),
    memo:       document.getElementById('fMemo').value.trim(),
    catParent:  document.getElementById('fCatParent').value,
    catChild:   document.getElementById('fCatChild').value,
    catGrand:   document.getElementById('fCatGrand').value,
    tags:       [...formTags],
    favorite:   document.getElementById('fFav').checked,
    views:      0,
    createdAt:  now,
    updatedAt:  now,
  };

  if (editingRefId) {
    // 既存を更新（閲覧回数・登録日は保持）
    const old = refs.find(x => x.id === editingRefId);
    r.views     = old.views;
    r.createdAt = old.createdAt;
    const idx = refs.findIndex(x => x.id === editingRefId);
    refs[idx] = r;
    showToast('更新しました ✓', 'success');
  } else {
    refs.unshift(r);
    showToast('登録しました ✓', 'success');
  }

  saveData(STORAGE_KEYS.refs, refs);
  closeModal('formModal');
  renderCards();
}

/* =====================================================
   ⑩ タグ入力
   ===================================================== */

function renderFormTags() {
  const list = document.getElementById('fTagList');
  list.innerHTML = formTags.map((t, i) => `
    <span class="tag-deletable tag" style="background:var(--tag-${i % 8})">
      ${escHtml(t)}
      <button type="button" data-idx="${i}" aria-label="タグを削除">✕</button>
    </span>
  `).join('');
  list.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      formTags.splice(parseInt(btn.dataset.idx), 1);
      renderFormTags();
    });
  });
}

document.getElementById('fTagInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ',') {
    e.preventDefault();
    const val = e.target.value.trim().replace(/,/g, '');
    if (val && !formTags.includes(val)) {
      formTags.push(val);
      renderFormTags();
    }
    e.target.value = '';
  }
  // Backspaceで最後のタグ削除
  if (e.key === 'Backspace' && e.target.value === '' && formTags.length) {
    formTags.pop();
    renderFormTags();
  }
});

document.getElementById('tagInputWrap').addEventListener('click', () => {
  document.getElementById('fTagInput').focus();
});

/* =====================================================
   ⑪ サムネイル処理
   ===================================================== */

// URLを直接入力したとき
document.getElementById('fThumbUrl').addEventListener('input', (e) => {
  const url = e.target.value.trim();
  const img = document.getElementById('thumbImg');
  const ph  = document.getElementById('thumbPlaceholder');
  if (url) {
    img.src = url;
    img.style.display = 'block';
    ph.style.display  = 'none';
  } else {
    img.style.display = 'none';
    ph.style.display  = '';
  }
});

// ファイル選択ボタン
document.getElementById('thumbFileBtn').addEventListener('click', () => {
  document.getElementById('fThumbFile').click();
});

document.getElementById('fThumbFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (file) loadImageFile(file);
});

// ドラッグ＆ドロップ
const thumbArea = document.getElementById('thumbArea');
thumbArea.addEventListener('dragover', (e) => {
  e.preventDefault();
  document.getElementById('thumbPreview').classList.add('drag-over');
});
thumbArea.addEventListener('dragleave', () => {
  document.getElementById('thumbPreview').classList.remove('drag-over');
});
thumbArea.addEventListener('drop', (e) => {
  e.preventDefault();
  document.getElementById('thumbPreview').classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) loadImageFile(file);
});

function loadImageFile(file) {
  const reader = new FileReader();
  reader.onload = (ev) => {
    const url = ev.target.result; // base64
    document.getElementById('fThumbUrl').value = url;
    const img = document.getElementById('thumbImg');
    img.src = url;
    img.style.display = 'block';
    document.getElementById('thumbPlaceholder').style.display = 'none';
  };
  reader.readAsDataURL(file);
}

/* =====================================================
   ⑫ 詳細モーダル
   ===================================================== */

function openDetail(id) {
  const r = refs.find(x => x.id === id);
  if (!r) return;
  currentDetailId = id;

  // 閲覧回数を加算
  r.views = (r.views || 0) + 1;
  saveData(STORAGE_KEYS.refs, refs);

  // 最近見たリストに追加（先頭に・重複削除・20件上限）
  recentIds = [id, ...recentIds.filter(i => i !== id)].slice(0, 20);
  saveData(STORAGE_KEYS.recent, recentIds);

  // カードの閲覧数表示を更新
  renderCards();

  // 詳細モーダルを更新
  document.getElementById('detailTitle').textContent = r.title;

  // サムネイル
  const dThumb = document.getElementById('detailThumb');
  const dPH    = document.getElementById('detailThumbPlaceholder');
  if (r.thumbnail) {
    dThumb.src = r.thumbnail;
    dThumb.style.display = 'block';
    dPH.style.display = 'none';
  } else {
    dThumb.style.display = 'none';
    const { icon } = detectUrlType(r.url);
    dPH.textContent = icon;
    dPH.style.display = 'flex';
  }

  // メタ情報
  const catPath = getCatPathStr(r.catGrand || r.catChild || r.catParent);
  document.getElementById('detailCat').textContent   = catPath;
  document.getElementById('detailViews').textContent = `👁 ${r.views} 回`;
  document.getElementById('detailDate').textContent  = `📅 ${formatDate(r.createdAt)}`;

  // タグ
  const tagsEl = document.getElementById('detailTags');
  tagsEl.innerHTML = (r.tags || []).map(t => `<span class="tag">${escHtml(t)}</span>`).join('');

  // メモ
  const memoWrap = document.getElementById('detailMemoWrap');
  if (r.memo) {
    document.getElementById('detailMemo').textContent = r.memo;
    memoWrap.style.display = '';
  } else {
    memoWrap.style.display = 'none';
  }

  // URLボタン
  const urlBtn = document.getElementById('detailOpenUrl');
  if (r.url) {
    urlBtn.style.display = '';
    urlBtn.onclick = () => window.open(r.url, '_blank', 'noopener');
  } else {
    urlBtn.style.display = 'none';
  }

  // お気に入りボタン
  const favBtn = document.getElementById('detailFavBtn');
  favBtn.textContent = r.favorite ? '⭐ お気に入り解除' : '☆ お気に入り';
  favBtn.onclick = () => {
    r.favorite = !r.favorite;
    saveData(STORAGE_KEYS.refs, refs);
    favBtn.textContent = r.favorite ? '⭐ お気に入り解除' : '☆ お気に入り';
    renderCards();
    showToast(r.favorite ? 'お気に入りに追加 ⭐' : 'お気に入りを解除しました', 'success');
  };

  // 編集ボタン
  document.getElementById('detailEditBtn').onclick = () => {
    closeModal('detailModal');
    openEditForm(id);
  };

  // 削除ボタン
  document.getElementById('detailDeleteBtn').onclick = () => {
    showConfirm('このリファレンスを削除しますか？', () => {
      refs = refs.filter(x => x.id !== id);
      saveData(STORAGE_KEYS.refs, refs);
      closeModal('detailModal');
      renderCards();
      showToast('削除しました', 'success');
    });
  };

  openModal('detailModal');
}

/* =====================================================
   ⑬ カテゴリー管理モーダル
   ===================================================== */

document.getElementById('catSaveBtn').addEventListener('click', () => {
  const name = document.getElementById('catNameInput').value.trim();
  if (!name) {
    showToast('カテゴリー名を入力してください', 'error');
    return;
  }

  if (editingCatInfo.mode === 'add') {
    const newNode = { id: genId('cat'), name, children: [] };
    if (editingCatInfo.parentId) {
      const parent = findCatById(categories, editingCatInfo.parentId);
      if (parent) parent.children.push(newNode);
    } else {
      categories.push(newNode);
    }
    showToast('カテゴリーを追加しました ✓', 'success');
  }

  if (editingCatInfo.mode === 'edit') {
    const node = findCatById(categories, editingCatInfo.catId);
    if (node) node.name = name;
    showToast('カテゴリー名を変更しました ✓', 'success');
  }

  saveData(STORAGE_KEYS.categories, categories);
  closeModal('catModal');
  renderCategoryTree();
  // フォームが開いていれば選択肢を更新
  if (document.getElementById('formModal').style.display !== 'none') {
    buildCatOptions(categories, document.getElementById('fCatParent'));
  }
});

// ルートカテゴリー追加ボタン
document.getElementById('addRootCatBtn').addEventListener('click', () => {
  editingCatInfo = { parentId: null, catId: null, mode: 'add' };
  document.getElementById('catModalTitle').textContent = 'ルートカテゴリーを追加';
  document.getElementById('catNameInput').value = '';
  openModal('catModal');
});

/* =====================================================
   ⑭ 削除確認モーダル
   ===================================================== */

function showConfirm(msg, callback) {
  document.getElementById('confirmMsg').textContent = msg;
  confirmCallback = callback;
  openModal('confirmModal');
}

document.getElementById('confirmOkBtn').addEventListener('click', () => {
  closeModal('confirmModal');
  if (confirmCallback) confirmCallback();
  confirmCallback = null;
});

/* =====================================================
   ⑮ バックアップ（エクスポート / インポート）
   ===================================================== */

document.getElementById('exportBtn').addEventListener('click', () => {
  const data = {
    version:    1,
    exportedAt: new Date().toISOString(),
    refs,
    categories,
    recentIds,
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = `creativeref_backup_${formatDateShort(Date.now())}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('エクスポートしました 📤', 'success');
});

document.getElementById('importBtn').addEventListener('click', () => {
  document.getElementById('importFile').click();
});

document.getElementById('importFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!Array.isArray(data.refs) || !Array.isArray(data.categories)) {
        throw new Error('フォーマットが正しくありません');
      }
      showConfirm('インポートすると現在のデータに追加されます。続けますか？', () => {
        // リファレンスはIDが重複しないもののみ追加
        const existIds = new Set(refs.map(r => r.id));
        const newRefs  = data.refs.filter(r => !existIds.has(r.id));
        refs = [...refs, ...newRefs];
        categories = data.categories;
        if (Array.isArray(data.recentIds)) recentIds = data.recentIds;
        saveData(STORAGE_KEYS.refs, refs);
        saveData(STORAGE_KEYS.categories, categories);
        saveData(STORAGE_KEYS.recent, recentIds);
        renderCategoryTree();
        renderCards();
        showToast(`インポート完了（${newRefs.length}件追加）📥`, 'success');
      });
    } catch (err) {
      showToast('インポート失敗：' + err.message, 'error');
    }
    e.target.value = ''; // リセット
  };
  reader.readAsText(file);
});

document.getElementById('searchInput').addEventListener('input', (e) => {

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter  = btn.dataset.filter;
    selectedCatId  = null;
    updatePageTitle();
    renderCategoryTree();
    renderCards();
  });
});

function updatePageTitle() {
  const el = document.getElementById('pageTitle');
  if (currentFilter === 'fav')    { el.textContent = 'お気に入り'; return; }
  if (currentFilter === 'recent') { el.textContent = '最近見た'; return; }
  if (selectedCatId) {
    const path = getCatPath(categories, selectedCatId);
    el.textContent = path ? path[path.length - 1] : 'カテゴリー';
    return;
  }
  el.textContent = 'すべてのリファレンス';
}

   ⑰ モーダル開閉ユーティリティ

function openModal(id) {
  document.getElementById(id).style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function closeModal(id) {
  document.getElementById(id).style.display = 'none';
  // 他のモーダルが開いていなければスクロールを戻す
  const anyOpen = ['formModal','detailModal','catModal','confirmModal']
    .some(m => document.getElementById(m).style.display !== 'none');
  if (!anyOpen) document.body.style.overflow = '';
}

  ['formCancelBtn',     'formModal'],

  ['catModalClose',     'catModal'],

  ['confirmModalClose', 'confirmModal'],

  document.getElementById(btnId).addEventListener('click', () => closeModal(modalId));

/* =====================================================
   ⑲ トースト通知
   ===================================================== */

let toastTimer = null;

function showToast(msg, type = 'default') {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className   = `toast ${type} show`;
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.classList.remove('show');
  }, 2800);
}

/* =====================================================
   ⑳ ユーティリティ
   ===================================================== */

// HTMLエスケープ（XSS対策）
function escHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// 日付フォーマット（YYYY/MM/DD HH:mm）
function formatDate(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
}

// ファイル名用短縮日付（YYYYMMDD）
function formatDateShort(ts) {
  const d = new Date(ts);
  return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
}

   ㉑ 初期化

function init() {
  renderCategoryTree();
  renderCards();
  buildCatOptions(categories, document.getElementById('fCatParent'));
}

init();
